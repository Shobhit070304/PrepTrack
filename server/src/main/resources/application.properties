spring.application.name=preptrack

# Neon PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway creates the tables (runs automatically on startup)
spring.flyway.enabled=false

# Hibernate only CHECKS that entities match the tables. It no longer changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Don't keep the DB session open during JSON conversion (we use @Transactional instead)
spring.jpa.open-in-view=false



# Google Sign-In: our Client ID (used to check that a token was made for our app)
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}

# Comma-separated list of emails that get the ADMIN role
app.admin-email=${ADMIN_EMAIL:sharmashobhit1000@gmail.com}

# Auth cookie: set to true when you deploy with HTTPS
app.cookie-secure=${COOKIE_SECURE:false}